<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>异世界拷问姬·血之迷宫</title>
<link rel="stylesheet" href="./assets/index-DDrze6ZF.css" />
<style>
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0d0a12;color:#c9b8a3;font-family:serif;z-index:9999}
#boot .bar{width:220px;height:4px;background:#2a2233;margin-top:14px;border-radius:2px;overflow:hidden}
#boot .bar i{display:block;height:100%;width:30%;background:#a03e4e;border-radius:2px;animation:b 1.1s ease-in-out infinite alternate}
@keyframes b{from{margin-left:0}to{margin-left:70%}}
</style>
<script>
//<![CDATA[
(async function () {
  var st = document.getElementById('boot-status');
  function say(t) { if (st) st.textContent = t; }
  try {
    if (!('serviceWorker' in navigator)) throw new Error('当前浏览器不支持 Service Worker，请换用 Chrome / Edge 最新版');
    say('正在部署离线资源层…');
    var reg = await navigator.serviceWorker.register('./sw.js');
    await navigator.serviceWorker.ready;
    if (!navigator.serviceWorker.controller) { location.reload(); return; }
    say('正在加载游戏本体…');
    var code = '';
    for (var i = 1; i <= 8; i++) {
      var r = await fetch('./assets/game_js_' + i + '.txt');
      if (!r.ok) break;
      code += await r.text();
      say('正在加载游戏本体… ' + (i * 25) + '%');
    }
    if (!code) throw new Error('游戏本体分包缺失');
    say('正在启动…');
    var url = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
    await import(url);
    var b = document.getElementById('boot');
    if (b) b.parentNode.removeChild(b);
  } catch (err) {
    say('加载失败：' + (err && err.message ? err.message : err));
  }
})();
//]]>
</script>
</head>
<body>
<div id="root"></div>
<div id="boot"><div>异世界拷问姬·血之迷宫</div><div class="bar"><i></i></div><p id="boot-status">加载中…</p></div>
</body>
</html>
